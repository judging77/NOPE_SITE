<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUN STATS TOOL</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{font-family:system-ui,sans-serif;}
.bg-glass {
  background: rgba(30,30,30,0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
.log-table tbody tr:hover {
  background-color: rgba(0,255,150,0.1);
  transition: 0.2s;
}
.log-table tbody tr:nth-child(even){
  background-color: rgba(255,255,255,0.05);
}
@keyframes slideFade {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
.result-animate {
  animation: slideFade 0.5s ease forwards;
}
#onlineCounter:hover {
  box-shadow: 0 0 15px #00FFAA;
  transition: 0.3s;
}
#sidebar::-webkit-scrollbar {
  width: 6px;
}
#sidebar::-webkit-scrollbar-thumb {
  background-color: rgba(0,255,150,0.3);
  border-radius: 3px;
}
</style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center">

<div class="max-w-7xl w-full p-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-8 w-full">
    <div class="text-left">
      <h1 class="text-5xl font-bold text-cyan-400 tracking-tight">GUN STATS TOOL</h1>
      <p class="text-zinc-400 text-sm mt-1">Made by NOPE • Web v1.0</p>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="openFeedback()"
        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium shadow-md">
        Feedback
      </button>
      <button onclick="downloadApp()"
        class="px-6 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-medium shadow-md">
        Download App
      </button>
      <span id="onlineCounter"
            class="bg-zinc-800 text-white px-4 py-2 rounded-lg shadow-md text-sm font-semibold">
        Online: 123
      </span>
    </div>
  </div>

  <div id="mainContent" class="bg-glass rounded-2xl p-8 shadow-xl w-full relative"></div>

</div>

<script>
emailjs.init("GyacvY3nToZKyUwkA"); // public key

let logs = JSON.parse(localStorage.getItem("gunLogs")) || [];
const CURRENT_VERSION="1.0";

function saveLogs(){ localStorage.setItem("gunLogs", JSON.stringify(logs)); }

function setPage(page, addHistory=true){ if(addHistory){ history.pushState({page:page},"","#"+page); } }
history.replaceState({page:"menu"},"","#menu");
window.onpopstate = function(event){
    const page = event.state?.page || "menu";
    if(page === "menu") renderMainMenu(false);
    else if(page === "calculator") showCalculator(false);
    else if(page === "log") showLog(false);
    else if(page.startsWith("sorted_")) showSorted(page.split("_")[1], false);
    else if(page.startsWith("category_")) showCategory(page.split("_")[1], false);
    else renderMainMenu(false);
};

/* -----------------------------
MAIN MENU
----------------------------- */
function renderMainMenu(addHistory=true){
    setPage("menu", addHistory);
    document.getElementById("mainContent").innerHTML=`
    <div class="flex flex-col items-center justify-center gap-6 min-h-[400px]">

      <button onclick="showCalculator()"
        class="w-64 bg-gradient-to-r from-green-500 to-emerald-600
               hover:scale-105 transform transition p-6 rounded-3xl text-2xl font-bold shadow-lg">
        Calculate Gun Stats
      </button>

      <button onclick="showLog()"
        class="w-56 bg-zinc-800 hover:bg-zinc-700
               p-5 rounded-2xl text-xl font-semibold shadow-md transform transition hover:scale-105">
        View Gun Log
      </button>

      <button onclick="renderMainMenu()"
        class="w-56 bg-zinc-800 hover:bg-zinc-700
               p-5 rounded-2xl text-xl font-semibold shadow-md transform transition hover:scale-105">
        Clear Display
      </button>

      <button onclick="deleteLog()"
        class="w-56 bg-red-900 hover:bg-red-800
               p-5 rounded-2xl text-xl font-semibold shadow-md transform transition hover:scale-105">
        Delete Log
      </button>

    </div>
    `;
}

/* -----------------------------
CALCULATOR WITH SIDEBAR
----------------------------- */
function showCalculator(addHistory=true){
    setPage("calculator", addHistory);
    document.getElementById("mainContent").innerHTML=`
    <div class="relative flex">

      <!-- LEFT FIXED SIDEBAR -->
      <div id="sidebar" class="fixed left-0 top-0 h-full w-48 bg-zinc-900 p-4 flex flex-col gap-2 overflow-y-auto shadow-lg z-50">
        <button class="bg-cyan-500 hover:bg-cyan-400 py-2 rounded-lg font-bold text-white shadow-md">
          Gun Stats
        </button>
        ${getCategoryButtonsHTML()}
      </div>

      <!-- CENTER CALCULATOR -->
      <div class="flex-1 flex justify-center ml-56">
        <div class="max-w-lg bg-glass p-8 rounded-2xl shadow-xl mt-8">
          <h2 class="text-3xl font-bold mb-6 text-cyan-400">Enter Gun Stats</h2>

          <div class="space-y-5">
            <div>
              <label class="block text-zinc-400 mb-1">Gun name</label>
              <input id="gun" class="w-full bg-zinc-800 rounded-lg px-4 py-3" placeholder="e.g. Chord">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Bullets fired</label>
              <input id="bullets" type="number" step="0.01" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Time (seconds)</label>
              <input id="seconds" type="number" step="0.01" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Damage per bullet</label>
              <input id="dmg" type="number" step="0.01" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>
            <div>
              <label class="block text-zinc-400 mb-1">Target health</label>
              <input id="hp" type="number" step="0.01" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

            <div>
              <label class="block text-zinc-400 mb-1">Category</label>
              <select id="category" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
                <option value="Machine Guns">Machine Guns</option>
                <option value="Shotguns">Shotguns</option>
                <option value="Auto Cannons">Auto Cannons</option>
                <option value="Cannons">Cannons</option>
                <option value="Rocket Launchers">Rocket Launchers</option>
                <option value="Grenade Launchers">Grenade Launchers</option>
                <option value="Energy Weapons">Energy Weapons</option>
                <option value="Crossbows">Crossbows</option>
                <option value="Melee Weapons">Melee Weapons</option>
                <option value="Flame Weapons">Flame Weapons</option>
                <option value="Cryo Weapons">Cryo Weapons</option>
                <option value="Mine Layers">Mine Layers</option>
                <option value="Drones">Drones</option>
                <option value="Uncategorized">Uncategorized</option>
              </select>
            </div>
          </div>

          <div class="flex gap-4 mt-8">
            <button onclick="calculate()"
              class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl text-lg font-semibold shadow-lg transform transition hover:scale-105">
              Calculate & Save
            </button>
            <button onclick="renderMainMenu()"
              class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-4 rounded-2xl text-lg font-semibold shadow-md transform transition hover:scale-105">
              Back to Menu
            </button>
          </div>

          <div id="resultBox" class="mt-8 bg-black p-6 rounded-2xl hidden"></div>
        </div>
      </div>
    </div>
    `;
}

// Generate sidebar buttons with onclick
function getCategoryButtonsHTML() {
    const categories = ["Machine Guns","Shotguns","Auto Cannons","Cannons","Rocket Launchers","Grenade Launchers","Energy Weapons","Crossbows","Melee Weapons","Flame Weapons","Cryo Weapons","Mine Layers","Drones","Uncategorized"];
    return categories.map(cat=>`<button class="bg-zinc-800 hover:bg-zinc-700 py-2 rounded-lg text-white text-sm" onclick="showCategory('${cat}')">${cat}</button>`).join('');
}

// Show guns by category
function showCategory(category, addHistory=true){
    setPage("category_" + category, addHistory);
    let filtered = logs.filter(log => log.category === category);

    let html = `<h2 class="text-3xl font-bold mb-6 text-cyan-400">${category}</h2>`;

    // Sorting buttons
    html += `
      <div class="flex gap-4 mb-4">
        <button onclick="sortCategory('${category}','dps')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Highest DPS</button>
        <button onclick="sortCategory('${category}','bps')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Highest BPS</button>
        <button onclick="sortCategory('${category}','ttk')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Lowest TTK</button>
      </div>
    `;

    html += `<button onclick="showCalculator()"
                  class="mb-4 bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md hover:bg-zinc-600">
                 Back to Calculator
             </button>`;

    if(filtered.length === 0){
        html += `<p class="text-zinc-400">No guns saved in this category yet.</p>`;
    } else {
        html += renderLogTable(filtered);
    }

    document.getElementById("mainContent").innerHTML = html;
}

// Sorting inside category
function sortCategory(category, type){
    let filtered = logs.filter(log => log.category === category);

    if(type === 'dps') filtered.sort((a,b) => b.dps - a.dps);
    if(type === 'bps') filtered.sort((a,b) => b.bps - a.bps);
    if(type === 'ttk') filtered.sort((a,b) => a.ttk - b.ttk);

    let html = `<h2 class="text-3xl font-bold mb-6 text-cyan-400">${category}</h2>`;

    // Sorting buttons again
    html += `
      <div class="flex gap-4 mb-4">
        <button onclick="sortCategory('${category}','dps')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Highest DPS</button>
        <button onclick="sortCategory('${category}','bps')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Highest BPS</button>
        <button onclick="sortCategory('${category}','ttk')" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md">Lowest TTK</button>
      </div>
    `;

    html += `<button onclick="showCalculator()"
                  class="mb-4 bg-zinc-700 px-4 py-2 rounded-lg font-semibold shadow-md hover:bg-zinc-600">
                 Back to Calculator
             </button>`;

    html += renderLogTable(filtered);

    document.getElementById("mainContent").innerHTML = html;
}

// Helper to render table
function renderLogTable(array){
    let html = `<table class="log-table w-full text-left">
                 <thead class="bg-zinc-800">
                 <tr><th class="p-3">Date</th><th class="p-3">Gun</th>
                     <th class="p-3">BPS</th><th class="p-3">DPS</th><th class="p-3">TTK</th></tr>
                 </thead><tbody>`;
    array.forEach(log=>{
        const ttkDisplay = isFinite(log.ttk) ? log.ttk : "∞";
        html += `<tr class="border-t border-zinc-800">
                    <td class="p-3">${log.date} ${log.time}</td>
                    <td class="p-3">${log.gun}</td>
                    <td class="p-3">${log.bps}</td>
                    <td class="p-3">${log.dps}</td>
                    <td class="p-3">${ttkDisplay}</td>
                 </tr>`;
    });
    html += `</tbody></table>`;
    return html;
}

/* -----------------------------
CALCULATE
----------------------------- */
function calculate(){
    const gun=document.getElementById("gun").value.trim();
    const bullets=parseFloat(document.getElementById("bullets").value);
    const seconds=parseFloat(document.getElementById("seconds").value);
    const dmg=parseFloat(document.getElementById("dmg").value);
    const hp=parseFloat(document.getElementById("hp").value);
    const category=document.getElementById("category").value;

    if(!gun||isNaN(bullets)||isNaN(seconds)||isNaN(dmg)||isNaN(hp)){
        alert("Please fill all fields"); return;
    }
    if(seconds<=0){ alert("Time must be greater than 0"); return; }

    const bps=(bullets/seconds).toFixed(3);
    const dps=(bps*dmg).toFixed(2);
    const ttk=dps>0?(hp/dps).toFixed(3):"∞";

    const box=document.getElementById("resultBox");
    box.innerHTML=`
      <div class="text-emerald-400 text-xl font-mono result-animate">
        RESULTS<br><br>
        Gun: ${gun}<br>
        BPS: ${bps}<br>
        DPS: ${dps}<br>
        TTK: ${ttk} seconds<br>
        Category: ${category}
      </div>`;
    box.classList.remove("hidden");

    const now=new Date();
    logs.push({
        date:now.toISOString().split("T")[0],
        time:now.toTimeString().slice(0,8),
        gun, bullets, seconds, dmg, hp,
        bps:parseFloat(bps),
        dps:parseFloat(dps),
        ttk:ttk==="∞"?Infinity:parseFloat(ttk),
        category
    });
    saveLogs();
}

/* -----------------------------
PRELOAD EXAMPLE GUNS
----------------------------- */
if(!logs.some(g=>g.gun==="Chord")) logs.push({
    date:"2026-03-15", time:"12:00:00",
    gun:"Chord", bullets:100, seconds:10, dmg:15, hp:1000,
    bps:10, dps:150, ttk:6.667, category:"Machine Guns"
});
if(!logs.some(g=>g.gun==="Lupara")) logs.push({
    date:"2026-03-15", time:"12:00:00",
    gun:"Lupara", bullets:10, seconds:2, dmg:50, hp:500,
    bps:5, dps:250, ttk:2, category:"Shotguns"
});
saveLogs();

/* -----------------------------
LOG VIEW
----------------------------- */
function showLog(addHistory=true){
    setPage("log", addHistory);
    let html = `<h2 class="text-3xl font-bold mb-6 text-cyan-400">Gun Log</h2>`;
    if(logs.length===0){ html += `<p class="text-zinc-400">No entries yet</p>`; }
    else{
        html += renderLogTable(logs);
    }
    document.getElementById("mainContent").innerHTML = html;
}

/* -----------------------------
SORT VIEW, DELETE, FEEDBACK, DOWNLOAD, COUNTER
----------------------------- */
function showSorted(type, addHistory = true){
    setPage("sorted_" + type, addHistory);
    let sorted = [...logs];
    if(type === "dps") sorted.sort((a,b) => b.dps - a.dps);
    if(type === "bps") sorted.sort((a,b) => b.bps - a.bps);
    if(type === "ttk") sorted.sort((a,b) => a.ttk - b.ttk);
    let html = `<h2 class="text-3xl
