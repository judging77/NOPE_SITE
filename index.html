<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUN STATS TOOL</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{font-family:system-ui,sans-serif;}
.log-table th{cursor:pointer;}
.log-table th:hover{background:#27272a;}
</style>

</head>

<body class="bg-zinc-950 text-white min-h-screen">

<div class="max-w-4xl mx-auto p-6">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-6">

<div>
<h1 class="text-4xl font-bold tracking-tight">GUN STATS TOOL</h1>
<p class="text-zinc-400 text-sm mt-1">Made by NOPE • Web v1.1</p>
</div>

<div class="flex gap-3">

<button onclick="openFeedback()"
class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium">
Send Feedback to NOPE
</button>

<button onclick="checkForUpdates()"
class="px-6 py-2 bg-zinc-700 hover:bg-zinc-600 rounded-lg font-medium">
Check for Updates
</button>

<a href="https://www.mediafire.com/folder/jy7vaiogeqzd8/XO_CALCULATOR"
target="_blank"
class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg font-medium">
Download Desktop .exe
</a>

</div>
</div>

<div id="mainContent"
class="bg-zinc-900 rounded-2xl p-8 shadow-xl"></div>

</div>

<script>

/* -----------------------------
DATA STORAGE
----------------------------- */

let logs = JSON.parse(localStorage.getItem("gunLogs")) || [];
const CURRENT_VERSION="1.1";

/* Save local logs */
function saveLogs(){
    localStorage.setItem("gunLogs",JSON.stringify(logs));
}

/* -----------------------------
HISTORY SYSTEM
----------------------------- */

function setPage(page, addHistory=true){
    if(addHistory){
        history.pushState({page:page},"","#"+page);
    }
}

history.replaceState({page:"menu"},"","#menu");

window.onpopstate = function(event){
    const page = event.state?.page || "menu";

    if(page === "menu") renderMainMenu(false);
    else if(page === "calculator") showCalculator(false);
    else if(page === "log") showLog(false);
    else if(page.startsWith("sorted_")){
        showSorted(page.split("_")[1], false);
    }
    else if(page === "leaderboard") showLeaderboard(false);
    else renderMainMenu(false);
};

/* -----------------------------
MAIN MENU
----------------------------- */

function renderMainMenu(addHistory=true){
    setPage("menu",addHistory);

    document.getElementById("mainContent").innerHTML=`
    <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">

        <button onclick="showCalculator()"
        class="bg-zinc-800 hover:bg-zinc-700 p-8 rounded-2xl text-xl font-semibold">
        Calculate Gun Stats
        </button>

        <button onclick="showLog()"
        class="bg-zinc-800 hover:bg-zinc-700 p-8 rounded-2xl text-xl font-semibold">
        View Gun Log
        </button>

        <button onclick="showLeaderboard()"
        class="bg-zinc-800 hover:bg-zinc-700 p-8 rounded-2xl text-xl font-semibold">
        Global Leaderboard
        </button>

        <button onclick="deleteLog()"
        class="bg-red-900 hover:bg-red-800 p-8 rounded-2xl text-xl font-semibold">
        Delete Log
        </button>

    </div>

    <div class="flex gap-3 justify-center mt-8">

        <button onclick="showSorted('dps')" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-xl">
        Sort by Highest DPS
        </button>

        <button onclick="showSorted('bps')" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-xl">
        Sort by Highest BPS
        </button>

        <button onclick="showSorted('ttk')" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-xl">
        Sort by Lowest TTK
        </button>

    </div>
    `;
}

/* -----------------------------
CALCULATOR
----------------------------- */

function showCalculator(addHistory=true){
    setPage("calculator",addHistory);

    document.getElementById("mainContent").innerHTML=`
    <div class="max-w-lg mx-auto">

        <h2 class="text-2xl font-bold mb-6">Enter Gun Stats</h2>

        <div class="space-y-5">

            <div>
            <label class="block text-zinc-400 mb-1">Gun name</label>
            <input id="gun" class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

            <div>
            <label class="block text-zinc-400 mb-1">Bullets fired</label>
            <input id="bullets" type="number" step="0.01"
            class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

            <div>
            <label class="block text-zinc-400 mb-1">Time (seconds)</label>
            <input id="seconds" type="number" step="0.01"
            class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

            <div>
            <label class="block text-zinc-400 mb-1">Damage per bullet</label>
            <input id="dmg" type="number" step="0.01"
            class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

            <div>
            <label class="block text-zinc-400 mb-1">Target health</label>
            <input id="hp" type="number" step="0.01"
            class="w-full bg-zinc-800 rounded-lg px-4 py-3">
            </div>

        </div>

        <div class="flex gap-4 mt-8">

            <button onclick="calculate()"
            class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl text-lg font-semibold">
            Calculate & Save
            </button>

            <button onclick="renderMainMenu()"
            class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-4 rounded-2xl text-lg font-semibold">
            Back to Menu
            </button>

        </div>

        <div id="resultBox"
        class="mt-8 bg-black p-6 rounded-2xl hidden"></div>

    </div>
    `;
}

/* -----------------------------
CALCULATE
----------------------------- */

function calculate(){
    const gun=document.getElementById("gun").value.trim();
    const bullets=parseFloat(document.getElementById("bullets").value);
    const seconds=parseFloat(document.getElementById("seconds").value);
    const dmg=parseFloat(document.getElementById("dmg").value);
    const hp=parseFloat(document.getElementById("hp").value);

    if(!gun||isNaN(bullets)||isNaN(seconds)||isNaN(dmg)||isNaN(hp)){
        alert("Please fill all fields");
        return;
    }

    if(seconds<=0){
        alert("Time must be greater than 0");
        return;
    }

    const bps=(bullets/seconds).toFixed(3);
    const dps=(bps*dmg).toFixed(2);
    const ttk=dps>0?(hp/dps).toFixed(3):"∞";

    document.getElementById("resultBox").innerHTML=`
        <div class="text-emerald-400 text-xl font-mono">
        RESULTS<br><br>
        Gun: ${gun}<br>
        BPS: ${bps}<br>
        DPS: ${dps}<br>
        TTK: ${ttk} seconds
        </div>
    `;

    document.getElementById("resultBox").classList.remove("hidden");

    const now=new Date();

    const logEntry = {
        date:now.toISOString().split("T")[0],
        time:now.toTimeString().slice(0,8),
        gun,
        bullets,
        seconds,
        dmg,
        hp,
        bps:parseFloat(bps),
        dps:parseFloat(dps),
        ttk:ttk==="∞"?Infinity:parseFloat(ttk)
    };

    logs.push(logEntry);
    saveLogs();

    // Send to global leaderboard server
    sendToLeaderboard(logEntry);
}

/* -----------------------------
SEND TO GLOBAL LEADERBOARD SERVER
----------------------------- */

function sendToLeaderboard(logEntry){
    fetch('http://YOUR_SERVER_IP:3000/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            gun: logEntry.gun,
            bps: logEntry.bps,
            dps: logEntry.dps,
            ttk: logEntry.ttk,
            timestamp: new Date().toISOString()
        })
    }).catch(e => console.warn("Could not send to leaderboard:", e));
}

/* -----------------------------
LOG VIEW
----------------------------- */

function showLog(addHistory=true){
    setPage("log", addHistory);

    let html = `<div><h2 class="text-2xl font-bold mb-6">Gun Log</h2>`;

    if(logs.length === 0){
        html += `<p class="text-zinc-400">No entries yet</p>`;
    } else {
        html += `
        <table class="log-table w-full text-left">
        <thead class="bg-zinc-800">
        <tr>
        <th class="p-3">Date</th>
        <th class="p-3">Gun</th>
        <th class="p-3">BPS</th>
        <th class="p-3">DPS</th>
        <th class="p-3">TTK</th>
        </tr>
        </thead>
        <tbody>
        `;

        logs.forEach(log=>{
            const ttkDisplay=isFinite(log.ttk)?log.ttk:"∞";
            html += `
            <tr class="border-t border-zinc-800">
            <td class="p-3">${log.date} ${log.time}</td>
            <td class="p-3">${log.gun}</td>
            <td class="p-3">${log.bps}</td>
            <td class="p-3">${log.dps}</td>
            <td class="p-3">${ttkDisplay}</td>
            </tr>
            `;
        });

        html += `</tbody></table>`;
    }

    html += `</div>`;
    document.getElementById("mainContent").innerHTML = html;
}

/* -----------------------------
SORT VIEW
----------------------------- */

function showSorted(type, addHistory=true){
    if(addHistory){
        history.pushState({page:"sorted_"+type},"","#sorted_"+type);
    }

    let sorted=[...logs];
    if(type==="dps") sorted.sort((a,b)=>b.dps-a.dps);
    if(type==="bps") sorted.sort((a,b)=>b.bps-a.bps);
    if(type==="ttk") sorted.sort((a,b)=>a.ttk-b.ttk);

    let html = `<div><h2 class="text-2xl font-bold mb-6">Sorted by ${type.toUpperCase()}</h2>`;
    html += `<button onclick="renderMainMenu()" class="mb-4 bg-zinc-700 px-4 py-2 rounded-lg">Back</button>`;

    html += `<table class="log-table w-full text-left">
        <thead class="bg-zinc-800">
        <tr>
        <th class="p-3">Date</th>
        <th class="p-3">Gun</th>
        <th class="p-3">BPS</th>
        <th class="p-3">DPS</th>
        <th class="p-3">TTK</th>
        </tr>
        </thead>
        <tbody>
    `;

    sorted.forEach(log=>{
        const ttkDisplay=isFinite(log.ttk)?log.ttk:"∞";
        html += `
        <tr class="border-t border-zinc-800">
        <td class="p-3">${log.date} ${log.time}</td>
        <td class="p-3">${log.gun}</td>
        <td class="p-3">${log.bps}</td>
        <td class="p-3">${log.dps}</td>
        <td class="p-3">${ttkDisplay}</td>
        </tr>
        `;
    });

    html += `</tbody></table></div>`;
    document.getElementById("mainContent").innerHTML = html;
}

/* -----------------------------
LEADERBOARD
----------------------------- */

async function showLeaderboard(addHistory=true){
    setPage("leaderboard", addHistory);

    let html = `<div><h2 class="text-2xl font-bold mb-6">Global Gun Leaderboard</h2>`;
    html += `<button onclick="renderMainMenu()" class="mb-4 bg-zinc-700 px-4 py-2 rounded-lg">Back</button>`;
    html += `<table class="log-table w-full text-left">
        <thead class="bg-zinc-800">
        <tr>
        <th class="p-3">Gun</th>
        <th class="p-3">Avg DPS</th>
        <th class="p-3">Avg BPS</th>
        <th class="p-3">Avg TTK</th>
        <th class="p-3">Submissions</th>
        </tr>
        </thead>
        <tbody>
    `;

    try {
        const res = await fetch('http://YOUR_SERVER_IP:3000/leaderboard');
        const data = await res.json();
        data.forEach(entry => {
            html += `
            <tr class="border-t border-zinc-800">
            <td class="p-3">${entry.gun}</td>
            <td class="p-3">${entry.avgDPS}</td>
            <td class="p-3">${entry.avgBPS}</td>
            <td class="p-3">${entry.avgTTK}</td>
            <td class="p-3">${entry.submissions}</td>
            </tr>
            `;
        });
    } catch(e) {
        html += `<tr><td colspan="5" class="p-3 text-red-400">Could not load leaderboard</td></tr>`;
    }

    html += `</tbody></table></div>`;
    document.getElementById("mainContent").innerHTML = html;
}

/* -----------------------------
DELETE LOG
----------------------------- */

function deleteLog(){
    if(confirm("Delete ALL saved stats permanently?")){
        logs=[];
        saveLogs();
        alert("Log deleted!");
        renderMainMenu();
    }
}

/* -----------------------------
FEEDBACK
----------------------------- */

function openFeedback(){
    const comment=prompt("Write your feedback:");

    if(comment){
        const body=`Gun Stats Tool Feedback\n\n${comment}\n\nSent from Web v${CURRENT_VERSION}`;
        window.location.href=
        `mailto:nopenoted20@gmail.com?subject=Gun Stats Tool Feedback&body=${encodeURIComponent(body)}`;
    }
}

/* -----------------------------
UPDATES
----------------------------- */

function checkForUpdates(){
    window.open(
        "https://www.mediafire.com/folder/jy7vaiogeqzd8/XO_CALCULATOR",
        "_blank"
    );
    alert("Opening download page for latest desktop version...");
}

/* -----------------------------
START APP
----------------------------- */

renderMainMenu();

</script>

</body>
</html>
